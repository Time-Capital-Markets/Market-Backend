name: fourmint-backend
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fourmint
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres-init.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fourmint"]
      interval: 5s
      timeout: 5s
      retries: 20
  reference-service:
    mem_limit: 512m
    build:
      context: .
      args:
        SERVICE: reference-service
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/reference
      DB_USERNAME: fourmint
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-demo}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 120s
  trading-service:
    mem_limit: 512m
    build:
      context: .
      args:
        SERVICE: trading-service
    ports:
      - "127.0.0.1:8082:8080"
